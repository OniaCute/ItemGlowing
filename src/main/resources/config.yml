# =====================================================
# ItemGlowing Configuration
# Author: OniaCute (www.oniacute.cc)
# =====================================================

# 是否为掉落物添加发光效果
glowing: true

# 物品发光 / 名牌颜色（按品质区分）
# 支持 "#RRGGBB" 或 "&#RRGGBB" 十六进制颜色
commonColor:   "#ababab"
uncommonColor: "#ffffff"
rareColor:     "#2dabff"
epicColor:     "#dc67ff"
legendColor:   "#ffbe3c"

# 名牌样式。留空 "" 则不显示名牌。
# 占位符：
#   {rarityColor} = 品质对应的颜色码（自动展开）
#   {item}        = 物品本地化名称（客户端显示对应语言）
#   {amount}      = 物品堆叠数量
#   {time}        = 剩余秒数
# 同时支持 & 颜色码和 &#RRGGBB 十六进制颜色
nametag: "{rarityColor}{item} &fx &b{amount} &7| &#6cd3ff{time}s"

# 不同品质的物品消失时间，单位：秒
despawnCommon:   150
despawnUncommon: 260
despawnRare:     300
despawnEpic:     400
despawnLegend:   500

# 只有玩家在指定半径内时才显示发光和名牌
# 设为 -1 则始终显示（不受距离限制）
radius: -1

# 主循环检测间隔，单位：Tick（最低 1）
detectTimer: 2

# 语言/消息配置
# 支持 & 颜色码和 &#RRGGBB 十六进制颜色
# 可用占位符：{prefix} {item} {items} {input} {rarity} {time}
messages:
  prefix:       "&#6cd3ffItemGlowing &8»"
  noPromission: "{prefix} &c你无权执行该操作!"
  invalid:      "{prefix} &c错误的用法! 用例:add/remove/reload/setrarity [item]"
  added:        "{prefix} &a物品 &e{item} &a已经被添加到忽略名单."
  removed:      "{prefix} &c物品 &e{item} &c已经被移出忽略名单."
  timeset:      "{prefix} &a品质为 &e{rarity} &a的物品消失时间已设置为 &e{time} &a秒."
  rarityset:    "{prefix} &a物品 &e{item} &a的品质已设置为 &e{rarity} &a."
  reloaded:     "{prefix} &a插件已重载,有 &e{items} &a个项目被忽略."
  error:        "{prefix} &c重载失败, 请检查配置文件是否正确!"

# 忽略名单：在此名单中的物品不会被添加发光/名牌效果
# 使用 Bukkit Material 名称（不区分大小写）
ignored:
  - "NETHERRACK"

# 自定义品质名单：为特定物品覆盖品质等级
# 使用 Bukkit Material 名称（不区分大小写）
# 可选品质：common / uncommon / rare / epic / legend
rarity:
  END_CRYSTAL: "uncommon"
